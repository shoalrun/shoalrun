# Upstream styles are kept under .vale/styles, so no `vale sync` or network
# access is needed. They come from jdkato/voices (MIT, Copyright (c) 2026
# Joseph Kato) and its dependency vale-cli/Std. See .vale/styles/NOTICE and
# .vale/styles/LICENSE. Shoalrun/ holds this project's own rules.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.{md,mdx}]
BasedOnStyles = Voices, Direct, Shoalrun

# Sentence length is editorial guidance, not a publication blocker.
Direct.Length = warning
